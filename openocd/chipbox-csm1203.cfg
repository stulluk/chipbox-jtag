# CelestialSemi CSM1203 (ARM926EJ-S) + Macronix MX29GL256E NOR @ 0x38000000

source [find mem_helper.tcl]
source /media/WORK/CHIPBOX-REBORN/chipbox-jtag/openocd/chipbox-init.tcl

set _CHIPNAME chipbox

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x07926477
}

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
	-expected-id $_CPUTAPID -expected-id 0x0792603f

reset_config srst_only srst_open_drain
adapter srst delay 200
jtag_ntrst_delay 200
# Cold connect only: 100 kHz (clone SYSCOMP timeouts at 1000 kHz during halt/init).
# Bulk flash I/O: scripts run "adapter speed ${OCD_ADAPTER_SPEED_KHZ}" after chipbox_cold_init.
adapter speed 100

set _TARGETNAME $_CHIPNAME.cpu
set _WORKAREA 0x05000000

target create $_TARGETNAME arm926ejs -endian little -chain-position $_TARGETNAME \
	-work-area-phys $_WORKAREA -work-area-size 0x10000 -work-area-backup 0

set _FLASHNAME $_CHIPNAME.nor
flash bank $_FLASHNAME cfi 0x38000000 0x02000000 2 2 $_TARGETNAME
